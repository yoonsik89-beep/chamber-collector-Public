<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>챔버 온습도 수집기</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f4; --card: #ffffff; --line: #e3e2de;
    --ink: #161615; --ink-2: #55544f; --ink-3: #8a8983;
    --accent: #2a78d6; --good: #1a7f4b; --warn: #b26b00; --bad: #c4302b;
    --good-bg: #e6f4ec; --warn-bg: #fdf1dc; --bad-bg: #fbe7e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #141413; --card: #1e1e1d; --line: #33322f;
      --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
      --accent: #3987e5; --good: #4cc488; --warn: #e6a23c; --bad: #ef6b66;
      --good-bg: #16301f; --warn-bg: #352812; --bad-bg: #3a1a19;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--ink-3); font-size: 13px; }
  button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 10px 16px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 14px 24px; font-size: 18px; }
  button.stop { background: var(--bad); border-color: var(--bad); color: #fff; }
  .status { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .pill { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .pill .k { font-size: 12px; color: var(--ink-3); }
  .pill .v { font-size: 16px; font-weight: 600; }
  .ok { color: var(--good); } .wn { color: var(--warn); } .er { color: var(--bad); }
  .banner { border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 15px; }
  .banner.er { background: var(--bad-bg); } .banner.wn { background: var(--warn-bg); } .banner.ok { background: var(--good-bg); }
  .banner code { background: rgba(127,127,127,.15); padding: 1px 6px; border-radius: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .sensor { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .sensor .name { font-weight: 600; }
  .sensor .id { font-size: 12px; color: var(--ink-3); word-break: break-all; }
  .sensor .vals { display: flex; gap: 20px; margin: 8px 0 4px; }
  .big { font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .unit { font-size: 15px; color: var(--ink-2); font-weight: 500; margin-left: 2px; }
  .meta { font-size: 13px; color: var(--ink-2); }
  .raw { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink-3); margin-top: 6px; word-break: break-all; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; }
  summary { cursor: pointer; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
  input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .empty { color: var(--ink-3); padding: 24px; text-align: center; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; }
  #log { font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--ink-2); max-height: 220px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>챔버 온습도 수집기</h1>
      <div class="sub">Govee 센서 블루투스 신호 → Google 시트 · 이 화면을 켜 둔 채로 두세요</div>
    </div>
    <button id="btnScan" class="primary">수집 시작</button>
  </header>

  <div id="banner"></div>

  <div class="status">
    <div class="pill"><div class="k">블루투스 수신</div><div class="v" id="stScan">대기</div></div>
    <div class="pill"><div class="k">시트 전송</div><div class="v" id="stUp">-</div></div>
    <div class="pill"><div class="k">전송 대기</div><div class="v" id="stQueue">0건</div></div>
    <div class="pill"><div class="k">마지막 전송</div><div class="v" id="stLast">-</div></div>
  </div>

  <div id="sensors" class="grid"><div class="empty">수집을 시작하면 주변 Govee 센서가 여기에 나타납니다.</div></div>

  <details id="setBox">
    <summary>설정</summary>
    <label>Apps Script 웹 앱 주소 (…/exec 로 끝나는 주소)</label>
    <input id="cfgUrl" placeholder="https://script.google.com/macros/s/……/exec" autocomplete="off">
    <label>비밀 문자열 (Apps Script의 TOKEN과 동일하게)</label>
    <input id="cfgToken" autocomplete="off">
    <label>기록 간격 (초) — 센서마다 이 간격으로 1건씩 시트에 남깁니다</label>
    <input id="cfgInterval" type="number" min="10" step="10">
    <label>수집기 이름 (태블릿이 여러 대일 때 구분용)</label>
    <input id="cfgCollector">
    <label>수집할 센서 (비우면 모두) — 센서ID 일부를 쉼표로 구분</label>
    <input id="cfgOnly" placeholder="예: 5179_1A2B, 5179_3C4D">
    <div class="row">
      <button id="btnSave">저장</button>
      <button id="btnTest">전송 테스트</button>
      <button id="btnRaw">원시 신호 보기</button>
    </div>
  </details>

  <details>
    <summary>기록</summary>
    <div id="log"></div>
  </details>
</main>

<script>
/* ───────────── Govee 광고 패킷 해석 ─────────────
 * H5179: 제조사 ID 0x8801, 데이터 9바이트
 *   [4..5] 온도 int16 LE ÷100, [6..7] 습도 uint16 LE ÷100, [8] 배터리 %
 * H5072/H5075/H5101/H5102 계열: 제조사 ID 0xEC88, [1..3] 24비트 묶음값
 *   (최상위 비트 = 음수, 값 = 온도×10000 + 습도×10), [4] 배터리 %
 * 해석값이 상식 범위를 벗어나면 '해석 실패'로 보고 원시값만 보여준다.
 */
function decodeGovee(companyId, b) {
  let r = null;
  if (companyId === 0x8801 && b.length >= 9) {
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    r = { model: 'H5179', temp: dv.getInt16(4, true) / 100, hum: dv.getUint16(6, true) / 100, batt: b[8] };
  } else if (companyId === 0xEC88 && b.length >= 5) {
    const v = (b[1] << 16) | (b[2] << 8) | b[3];
    const neg = (v & 0x800000) !== 0;
    const raw = v & 0x7FFFFF;
    r = { model: 'H507x', temp: (neg ? -1 : 1) * Math.floor(raw / 1000) / 10, hum: (raw % 1000) / 10, batt: b[4] };
  }
  if (!r) return null;
  r.temp = Math.round(r.temp * 100) / 100;
  r.hum = Math.round(r.hum * 100) / 100;
  if (!(r.temp >= -40 && r.temp <= 85 && r.hum >= 0 && r.hum <= 100)) return { ...r, invalid: true };
  if (!(r.batt >= 0 && r.batt <= 100)) r.batt = null;
  return r;
}
if (typeof module !== 'undefined') module.exports = { decodeGovee };
</script>

<script>
(() => {
  if (typeof document === 'undefined') return;
  const $ = (id) => document.getElementById(id);
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  };
  const QUEUE_MAX = 120000;      // 오프라인일 때 태블릿에 쌓아 두는 최대 건수 (센서 10대·1분 간격 ≈ 8일분)
  const BATCH = 500;

  const cfg = Object.assign({ url: '', token: '', interval: 60, collector: 'tablet-1', only: '' }, LS.get('gv_cfg', {}));
  // 대기열은 메모리에서는 [ts, id, temp, hum, batt, rssi], 저장할 때는 압축 형식으로 바꾼다
  // (센서ID는 번호로, 시각은 기준 시각과의 초 차이로, 온습도는 ×100 정수로 → 1건당 약 28자)
  function encodeQueue(q) {
    if (!q.length) return { v: 2, base: 0, ids: [], q: [] };
    const base = q[0][0], ids = [], map = {};
    const rows = q.map(r => {
      if (!(r[1] in map)) { map[r[1]] = ids.length; ids.push(r[1]); }
      return [Math.round((r[0] - base) / 1000), map[r[1]], Math.round(r[2] * 100), Math.round(r[3] * 100), r[4], r[5]];
    });
    return { v: 2, base, ids, q: rows };
  }
  function decodeQueue(o) {
    if (Array.isArray(o)) return o;   // 이전 버전 형식
    if (!o || !o.q) return [];
    return o.q.map(r => [o.base + r[0] * 1000, o.ids[r[1]], r[2] / 100, r[3] / 100, r[4], r[5]]);
  }
  let queue = decodeQueue(LS.get('gv_queue2', null) || LS.get('gv_queue', []));
  try { localStorage.removeItem('gv_queue'); } catch {}
  const latest = new Map();                   // id -> reading
  const nameById = new Map();                 // device.id -> name
  let scan = null, wakeLock = null, showRaw = false;
  let lastAdvTs = 0, lastUpOk = null, lastUpTs = 0, uploading = false;

  // ── 설정 화면 ──
  $('cfgUrl').value = cfg.url; $('cfgToken').value = cfg.token;
  $('cfgInterval').value = cfg.interval; $('cfgCollector').value = cfg.collector; $('cfgOnly').value = cfg.only;
  if (!cfg.url || !cfg.token) $('setBox').open = true;
  $('btnSave').onclick = () => {
    cfg.url = $('cfgUrl').value.trim();
    cfg.token = $('cfgToken').value.trim();
    cfg.interval = Math.max(10, Number($('cfgInterval').value) || 60);
    cfg.collector = $('cfgCollector').value.trim() || 'tablet-1';
    cfg.only = $('cfgOnly').value.trim();
    LS.set('gv_cfg', cfg);
    restartRecorder();
    log('설정 저장됨');
    renderBanner();
  };
  $('btnTest').onclick = () => upload(true);
  $('btnRaw').onclick = () => { showRaw = !showRaw; $('btnRaw').textContent = showRaw ? '원시 신호 숨기기' : '원시 신호 보기'; render(); };

  function log(msg) {
    const t = new Date().toLocaleTimeString('ko-KR', { hour12: false });
    const el = $('log');
    el.textContent = `[${t}] ${msg}\n` + el.textContent.slice(0, 6000);
  }

  // ── 지원 여부 안내 ──
  function renderBanner() {
    const b = $('banner');
    if (!('bluetooth' in navigator) || !navigator.bluetooth.requestLEScan) {
      b.className = 'banner er';
      b.innerHTML = '이 브라우저는 블루투스 신호 수신을 아직 허용하지 않았습니다. <b>Chrome</b>에서 주소창에 ' +
        '<code>chrome://flags/#enable-experimental-web-platform-features</code> 를 열어 <b>Enabled</b>로 바꾸고 Chrome을 다시 시작해 주세요. ' +
        '(삼성 인터넷이 아닌 Chrome이어야 합니다)';
      return;
    }
    if (!cfg.url || !cfg.token) {
      b.className = 'banner wn';
      b.innerHTML = '아래 <b>설정</b>에 Apps Script 주소와 비밀 문자열을 넣고 저장해 주세요. 그 전까지는 태블릿에만 쌓아 둡니다.';
      return;
    }
    b.className = ''; b.innerHTML = '';
  }

  // ── 블루투스 스캔 ──
  $('btnScan').onclick = async () => {
    if (scan && scan.active) { stopScan(); return; }
    try {
      scan = await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true, keepRepeatedDevices: true });
      log('블루투스 수신 시작');
      await keepAwake();
      updateScanUi();
    } catch (e) {
      log('수신 시작 실패: ' + e.message);
      alert('블루투스 수신을 시작하지 못했습니다.\n\n' + e.message +
        '\n\n확인: 블루투스 켜짐, 위치(GPS) 켜짐, Chrome의 위치·주변기기 권한 허용');
    }
  };
  function stopScan() {
    try { scan && scan.stop(); } catch {}
    log('블루투스 수신 중지');
    updateScanUi();
  }

  if (navigator.bluetooth) {
    navigator.bluetooth.addEventListener('advertisementreceived', (ev) => {
      const devId = ev.device.id;
      const name = ev.name || ev.device.name || nameById.get(devId) || '';
      if (name) nameById.set(devId, name);
      // 이름(센서ID)을 아직 모르는 신호는 건너뛴다 — 같은 센서가 이름 없는 항목으로 따로 잡히는 것을 막기 위함
      if (!name) return;
      for (const [cid, dv] of ev.manufacturerData) {
        if (cid !== 0x8801 && cid !== 0xEC88 && !/govee|gvh|h51|h50/i.test(name)) continue;
        const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
        const id = sensorId(name, devId);
        if (cfg.only && !cfg.only.split(',').some(s => s.trim() && id.toLowerCase().includes(s.trim().toLowerCase()))) continue;
        const d = decodeGovee(cid, bytes);
        const raw = cid.toString(16).padStart(4, '0') + ' | ' + [...bytes].map(x => x.toString(16).padStart(2, '0')).join(' ');
        const prev = latest.get(id) || {};
        latest.set(id, Object.assign(prev, { id, name, rssi: ev.rssi, raw, rawTs: Date.now() },
          d && !d.invalid ? { ts: Date.now(), temp: d.temp, hum: d.hum, batt: d.batt, model: d.model, bad: false } : { bad: true }));
        lastAdvTs = Date.now();
      }
      scheduleRender();
    });
  }
  function sensorId(name, devId) {
    const m = name.match(/(H\d{4}).*?([0-9A-F]{4})$/i);
    if (m) return `${m[1].toUpperCase()}_${m[2].toUpperCase()}`;
    return name || ('dev_' + devId.slice(0, 8));
  }

  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { log('화면 꺼짐 방지 실패: ' + e.message); }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && scan && scan.active) keepAwake(); });

  // ── 일정 간격 기록 ──
  let recTimer = null;
  function restartRecorder() {
    clearInterval(recTimer);
    recTimer = setInterval(record, cfg.interval * 1000);
  }
  function record() {
    const now = Date.now();
    let n = 0;
    for (const r of latest.values()) {
      if (!r.ts || now - r.ts > cfg.interval * 2000) continue;   // 최근 신호가 없으면 기록하지 않음
      queue.push([now, r.id, r.temp, r.hum, r.batt ?? null, r.rssi ?? null]);
      n++;
    }
    if (queue.length > QUEUE_MAX) {
      const drop = queue.length - QUEUE_MAX;
      queue.splice(0, drop);
      log(`전송 대기 초과로 오래된 ${drop}건 삭제`);
    }
    if (n) saveQueue();
    updateStatus();
  }
  function saveQueue() {
    if (LS.set('gv_queue2', encodeQueue(queue))) return;
    // 저장공간이 꽉 차면 가장 오래된 10%를 버리고 다시 시도
    const drop = Math.max(1, Math.floor(queue.length / 10));
    queue.splice(0, drop);
    log(`태블릿 저장공간 부족으로 오래된 ${drop}건 삭제 — 인터넷 연결을 확인하세요`);
    LS.set('gv_queue2', encodeQueue(queue));
  }

  // ── 시트로 전송 ──
  async function upload(manual) {
    if (uploading || !cfg.url || !cfg.token) { if (manual) alert('설정에서 주소와 비밀 문자열을 먼저 저장하세요.'); return; }
    uploading = true;
    const batch = queue.slice(0, BATCH);
    const body = {
      token: cfg.token,
      collector: cfg.collector,
      interval: cfg.interval,
      queue: queue.length,
      scanning: !!(scan && scan.active),
      lastAdvTs,
      batchId: batch.length ? `${cfg.collector}-${batch[0][0]}-${batch[0][1]}-${batch.length}-${batch[batch.length - 1][0]}` : '',
      readings: batch.map(r => ({ ts: r[0], sensor: r[1], temp: r[2], hum: r[3], batt: r[4], rssi: r[5] })),
    };
    try {
      const res = await fetch(cfg.url, { method: 'POST', body: JSON.stringify(body) });  // text/plain → 사전요청 없음
      const j = await res.json();
      if (!j.ok) throw new Error(j.error === 'unauthorized' ? '비밀 문자열 불일치' : (j.error || '알 수 없는 오류'));
      queue.splice(0, batch.length);
      saveQueue();
      lastUpOk = true; lastUpTs = Date.now();
      if (manual || batch.length) log(`전송 완료 ${j.written ?? 0}건${j.duplicate ? ' (중복 건너뜀)' : ''}, 남은 대기 ${queue.length}건`);
      if (manual) alert('전송 성공');
      if (queue.length >= BATCH) setTimeout(() => upload(false), 1500);   // 밀린 데이터 빠르게 비우기
    } catch (e) {
      lastUpOk = false;
      log('전송 실패: ' + e.message);
      if (manual) alert('전송 실패: ' + e.message);
    } finally {
      uploading = false;
      updateStatus();
    }
  }
  setInterval(() => upload(false), 30000);

  // ── 화면 ──
  let renderPending = false;
  function scheduleRender() { if (!renderPending) { renderPending = true; requestAnimationFrame(() => { renderPending = false; render(); }); } }
  function ago(ts) {
    if (!ts) return '-';
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 60) return `${s}초 전`;
    if (s < 3600) return `${Math.floor(s / 60)}분 전`;
    return `${Math.floor(s / 3600)}시간 전`;
  }
  function render() {
    const box = $('sensors');
    const list = [...latest.values()].sort((a, b) => a.id.localeCompare(b.id));
    if (!list.length) return;
    box.innerHTML = list.map(r => {
      const stale = !r.ts || Date.now() - r.ts > 120000;
      return `<div class="sensor">
        <div class="name">${esc(r.id)} ${stale ? '<span class="wn">· 신호 없음</span>' : ''}</div>
        <div class="id">${esc(r.name || '')}${r.model ? ' · ' + r.model : ''}</div>
        <div class="vals">
          <div><span class="big">${r.hum != null ? r.hum.toFixed(1) : '–'}</span><span class="unit">%RH</span></div>
          <div><span class="big">${r.temp != null ? r.temp.toFixed(1) : '–'}</span><span class="unit">°C</span></div>
        </div>
        <div class="meta">배터리 ${r.batt ?? '–'}% · 신호 ${r.rssi ?? '–'} dBm · ${ago(r.ts)}</div>
        ${r.bad ? '<div class="meta er">마지막 신호를 해석하지 못했습니다 — 원시 신호를 확인해 주세요</div>' : ''}
        ${showRaw ? `<div class="raw">${esc(r.raw || '')}</div>` : ''}
      </div>`;
    }).join('');
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function updateScanUi() {
    const on = !!(scan && scan.active);
    $('btnScan').textContent = on ? '수집 중지' : '수집 시작';
    $('btnScan').className = on ? 'stop' : 'primary';
    updateStatus();
  }
  function updateStatus() {
    const on = !!(scan && scan.active);
    const quiet = on && lastAdvTs && Date.now() - lastAdvTs > 120000;
    $('stScan').innerHTML = !on ? '<span class="er">중지됨</span>' : quiet ? '<span class="wn">신호 끊김</span>' : '<span class="ok">수신 중</span>';
    $('stUp').innerHTML = lastUpOk === null ? '-' : lastUpOk ? '<span class="ok">정상</span>' : '<span class="er">실패</span>';
    $('stQueue').textContent = `${queue.length.toLocaleString()}건`;
    $('stLast').textContent = ago(lastUpTs);
  }
  setInterval(() => { updateStatus(); render(); }, 5000);

  renderBanner();
  restartRecorder();
  updateScanUi();
  if (queue.length) log(`이전에 전송하지 못한 ${queue.length}건이 남아 있어 이어서 보냅니다`);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>챔버 온습도 수집기</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f4; --card: #ffffff; --line: #e3e2de;
    --ink: #161615; --ink-2: #55544f; --ink-3: #8a8983;
    --accent: #2a78d6; --good: #1a7f4b; --warn: #b26b00; --bad: #c4302b;
    --good-bg: #e6f4ec; --warn-bg: #fdf1dc; --bad-bg: #fbe7e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #141413; --card: #1e1e1d; --line: #33322f;
      --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
      --accent: #3987e5; --good: #4cc488; --warn: #e6a23c; --bad: #ef6b66;
      --good-bg: #16301f; --warn-bg: #352812; --bad-bg: #3a1a19;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--ink-3); font-size: 13px; }
  button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 10px 16px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 14px 24px; font-size: 18px; }
  button.stop { background: var(--bad); border-color: var(--bad); color: #fff; }
  .status { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .pill { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .pill .k { font-size: 12px; color: var(--ink-3); }
  .pill .v { font-size: 16px; font-weight: 600; }
  .ok { color: var(--good); } .wn { color: var(--warn); } .er { color: var(--bad); }
  .banner { border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 15px; }
  .banner.er { background: var(--bad-bg); } .banner.wn { background: var(--warn-bg); } .banner.ok { background: var(--good-bg); }
  .banner code { background: rgba(127,127,127,.15); padding: 1px 6px; border-radius: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .sensor { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .sensor .name { font-weight: 600; }
  .sensor .id { font-size: 12px; color: var(--ink-3); word-break: break-all; }
  .sensor .vals { display: flex; gap: 20px; margin: 8px 0 4px; }
  .big { font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .unit { font-size: 15px; color: var(--ink-2); font-weight: 500; margin-left: 2px; }
  .meta { font-size: 13px; color: var(--ink-2); }
  .raw { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink-3); margin-top: 6px; word-break: break-all; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; }
  summary { cursor: pointer; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
  input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .empty { color: var(--ink-3); padding: 24px; text-align: center; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; }
  .sensor { position: relative; }
  .sensor.missing { opacity: .55; border-style: dashed; }
  .sensor.missing .big { color: var(--ink-3); }
  .banner ol { margin: 6px 0 0; padding-left: 20px; }
  .sensor .edit { position: absolute; top: 10px; right: 10px; padding: 4px 10px; font-size: 16px; line-height: 1.2; color: var(--ink-2); }
  .sensor .name { padding-right: 44px; }
  .sensor .loc { color: var(--accent); font-weight: 600; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); padding: 18px; width: min(460px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .saver { position: fixed; inset: 0; background: #000; display: none; z-index: 100; cursor: none; }
  .saver.on { display: block; }
  .saver-box { position: absolute; color: #4a4a48; text-align: center; transition: left 2s ease, top 2s ease; user-select: none; }
  .sv-time { font-size: 44px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .sv-stat { font-size: 15px; margin-top: 4px; }
  .sv-stat.wn { color: #b07a1c; } .sv-stat.er { color: #c4504b; }
  .sv-hint { font-size: 11px; margin-top: 8px; color: #2e2e2d; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
    max-width: min(640px, 92vw); padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 15px;
    box-shadow: 0 6px 24px rgba(0,0,0,.2); transition: opacity .25s, transform .25s; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast.wn { background: #7a4b00; color: #fff; } .toast.ok { background: #1a7f4b; color: #fff; }
  #btnRescan:disabled { opacity: 1; color: var(--accent); border-color: var(--accent); }
  #log { font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--ink-2); max-height: 220px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>챔버 온습도 수집기</h1>
      <div class="sub">Govee 센서 블루투스 신호 → Google 시트 · 이 화면을 켜 둔 채로 두세요</div>
    </div>
    <div class="row" style="margin:0">
      <button id="btnRescan" title="블루투스 수신을 다시 시작해 주변 센서를 새로 찾습니다">센서 다시 찾기</button>
      <button id="btnScan" class="primary">수집 시작</button>
    </div>
  </header>

  <div id="banner"></div>

  <div class="status">
    <div class="pill"><div class="k">블루투스 수신</div><div class="v" id="stScan">대기</div></div>
    <div class="pill"><div class="k">시트 전송</div><div class="v" id="stUp">-</div></div>
    <div class="pill"><div class="k">전송 대기</div><div class="v" id="stQueue">0건</div></div>
    <div class="pill"><div class="k">마지막 전송</div><div class="v" id="stLast">-</div></div>
    <div class="pill"><div class="k">센서</div><div class="v" id="stSensors">-</div></div>
  </div>
  <div id="missTip" class="banner wn" style="display:none"></div>

  <div id="sensors" class="grid"><div class="empty">수집을 시작하면 주변 Govee 센서가 여기에 나타납니다.</div></div>

  <details id="setBox">
    <summary>설정</summary>
    <label>Apps Script 웹 앱 주소 (…/exec 로 끝나는 주소)</label>
    <input id="cfgUrl" placeholder="https://script.google.com/macros/s/……/exec" autocomplete="off">
    <label>비밀 문자열 (Apps Script의 TOKEN과 동일하게)</label>
    <input id="cfgToken" autocomplete="off">
    <label>기록 간격 (초) — 센서마다 이 간격으로 1건씩 시트에 남깁니다</label>
    <input id="cfgInterval" type="number" min="10" step="10">
    <label>수집기 이름 (태블릿이 여러 대일 때 구분용)</label>
    <input id="cfgCollector">
    <label>화면 보호 시작 (분) — 이 시간 동안 손대지 않으면 화면을 어둡게 바꿉니다. 0이면 사용 안 함</label>
    <input id="cfgSaver" type="number" min="0" step="1">
    <label>수집할 센서 (비우면 모두) — 센서ID 일부를 쉼표로 구분</label>
    <input id="cfgOnly" placeholder="예: 5179_1A2B, 5179_3C4D">
    <div class="row">
      <button id="btnSave">저장</button>
      <button id="btnTest">전송 테스트</button>
      <button id="btnRaw">원시 신호 보기</button>
    </div>
  </details>

  <details>
    <summary>기록</summary>
    <div id="log"></div>
  </details>
</main>

<dialog id="dlgEdit">
  <div style="font-weight:600;font-size:17px">센서 이름·위치</div>
  <div class="sub" id="edId" style="margin-bottom:4px"></div>
  <label>챔버명</label>
  <input id="edLabel" placeholder="예: 가압건조 챔버 1" autocomplete="off">
  <label>위치</label>
  <input id="edLoc" list="edLocList" placeholder="예: 연구실A" autocomplete="off">
  <datalist id="edLocList"></datalist>
  <div class="sub" style="margin-top:8px">저장하면 노트북 대시보드에도 같은 이름으로 바로 반영됩니다. 습도 알람 범위는 대시보드에서 정합니다.</div>
  <div class="sub er" id="edMsg" style="min-height:20px;margin-top:6px"></div>
  <div class="row" style="justify-content:flex-end">
    <button id="edForget" style="margin-right:auto">이 태블릿 목록에서 빼기</button>
    <button id="edCancel">취소</button><button id="edSave" class="primary" style="font-size:16px;padding:10px 18px">저장</button>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 화면 보호: 오래 손대지 않으면 검은 화면에 작은 상태 글자만, 위치를 계속 옮겨 가며 표시 -->
<div id="saver" class="saver" aria-hidden="true">
  <div id="saverBox" class="saver-box">
    <div id="svTime" class="sv-time"></div>
    <div id="svStat" class="sv-stat"></div>
    <div class="sv-hint">화면을 누르면 돌아갑니다</div>
  </div>
</div>

<script>
/* ───────────── Govee 광고 패킷 해석 ─────────────
 * H5179: 제조사 ID 0x8801, 데이터 9바이트
 *   [4..5] 온도 int16 LE ÷100, [6..7] 습도 uint16 LE ÷100, [8] 배터리 %
 * H5072/H5075/H5101/H5102 계열: 제조사 ID 0xEC88, [1..3] 24비트 묶음값
 *   (최상위 비트 = 음수, 값 = 온도×10000 + 습도×10), [4] 배터리 %
 * 해석값이 상식 범위를 벗어나면 '해석 실패'로 보고 원시값만 보여준다.
 */
function decodeGovee(companyId, b) {
  let r = null;
  if (companyId === 0x8801 && b.length >= 9) {
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    r = { model: 'H5179', temp: dv.getInt16(4, true) / 100, hum: dv.getUint16(6, true) / 100, batt: b[8] };
  } else if (companyId === 0xEC88 && b.length >= 5) {
    const v = (b[1] << 16) | (b[2] << 8) | b[3];
    const neg = (v & 0x800000) !== 0;
    const raw = v & 0x7FFFFF;
    r = { model: 'H507x', temp: (neg ? -1 : 1) * Math.floor(raw / 1000) / 10, hum: (raw % 1000) / 10, batt: b[4] };
  }
  if (!r) return null;
  r.temp = Math.round(r.temp * 100) / 100;
  r.hum = Math.round(r.hum * 100) / 100;
  if (!(r.temp >= -40 && r.temp <= 85 && r.hum >= 0 && r.hum <= 100)) return { ...r, invalid: true };
  if (!(r.batt >= 0 && r.batt <= 100)) r.batt = null;
  return r;
}
if (typeof module !== 'undefined') module.exports = { decodeGovee };
</script>

<script>
(() => {
  if (typeof document === 'undefined') return;
  const $ = (id) => document.getElementById(id);
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  };
  const QUEUE_MAX = 120000;      // 오프라인일 때 태블릿에 쌓아 두는 최대 건수 (센서 10대·1분 간격 ≈ 8일분)
  const BATCH = 500;

  const cfg = Object.assign({ url: '', token: '', interval: 60, collector: 'tablet-1', only: '', saverMin: 3 }, LS.get('gv_cfg', {}));
  // 대기열은 메모리에서는 [ts, id, temp, hum, batt, rssi], 저장할 때는 압축 형식으로 바꾼다
  // (센서ID는 번호로, 시각은 기준 시각과의 초 차이로, 온습도는 ×100 정수로 → 1건당 약 28자)
  function encodeQueue(q) {
    if (!q.length) return { v: 2, base: 0, ids: [], q: [] };
    const base = q[0][0], ids = [], map = {};
    const rows = q.map(r => {
      if (!(r[1] in map)) { map[r[1]] = ids.length; ids.push(r[1]); }
      return [Math.round((r[0] - base) / 1000), map[r[1]], Math.round(r[2] * 100), Math.round(r[3] * 100), r[4], r[5]];
    });
    return { v: 2, base, ids, q: rows };
  }
  function decodeQueue(o) {
    if (Array.isArray(o)) return o;   // 이전 버전 형식
    if (!o || !o.q) return [];
    return o.q.map(r => [o.base + r[0] * 1000, o.ids[r[1]], r[2] / 100, r[3] / 100, r[4], r[5]]);
  }
  let queue = decodeQueue(LS.get('gv_queue2', null) || LS.get('gv_queue', []));
  try { localStorage.removeItem('gv_queue'); } catch {}
  const latest = new Map();                   // id -> reading
  // device.id -> 블루투스 이름. 한 번 알아낸 이름은 기억해 두어, 새로고침 후 이름 없는 신호도 바로 알아본다
  const nameById = new Map(Object.entries(LS.get('gv_known', {})));
  let knownDirty = false;
  // 이 태블릿에서 한 번이라도 잡힌 센서 — 지금 안 잡히면 '찾는 중'으로 표시
  const seen = new Set(LS.get('gv_seen', []));
  const pendingIds = new Map();               // 이름을 아직 모르는 Govee 기기: device.id -> 마지막 수신 시각
  let scanStartTs = 0;
  let scan = null, wakeLock = null, showRaw = false;
  let lastAdvTs = 0, lastUpOk = null, lastUpTs = 0, uploading = false;

  // ── 설정 화면 ──
  $('cfgUrl').value = cfg.url; $('cfgToken').value = cfg.token;
  $('cfgInterval').value = cfg.interval; $('cfgCollector').value = cfg.collector; $('cfgOnly').value = cfg.only; $('cfgSaver').value = cfg.saverMin;
  if (!cfg.url || !cfg.token) $('setBox').open = true;
  $('btnSave').onclick = () => {
    cfg.url = $('cfgUrl').value.trim();
    cfg.token = $('cfgToken').value.trim();
    cfg.interval = Math.max(10, Number($('cfgInterval').value) || 60);
    cfg.collector = $('cfgCollector').value.trim() || 'tablet-1';
    cfg.only = $('cfgOnly').value.trim();
    cfg.saverMin = Math.max(0, Number($('cfgSaver').value) || 0);
    LS.set('gv_cfg', cfg);
    restartRecorder();
    log('설정 저장됨');
    renderBanner();
    fetchMeta();
  };
  $('btnTest').onclick = () => upload(true);
  $('btnRaw').onclick = () => { showRaw = !showRaw; $('btnRaw').textContent = showRaw ? '원시 신호 숨기기' : '원시 신호 보기'; render(); };

  function log(msg) {
    const t = new Date().toLocaleTimeString('ko-KR', { hour12: false });
    const el = $('log');
    el.textContent = `[${t}] ${msg}\n` + el.textContent.slice(0, 6000);
  }

  // ── 지원 여부 안내 ──
  function renderBanner() {
    const b = $('banner');
    if (!('bluetooth' in navigator) || !navigator.bluetooth.requestLEScan) {
      b.className = 'banner er';
      b.innerHTML = '이 브라우저는 블루투스 신호 수신을 아직 허용하지 않았습니다. <b>Chrome</b>에서 주소창에 ' +
        '<code>chrome://flags/#enable-experimental-web-platform-features</code> 를 열어 <b>Enabled</b>로 바꾸고 Chrome을 다시 시작해 주세요. ' +
        '(삼성 인터넷이 아닌 Chrome이어야 합니다)';
      return;
    }
    if (!cfg.url || !cfg.token) {
      b.className = 'banner wn';
      b.innerHTML = '아래 <b>설정</b>에 Apps Script 주소와 비밀 문자열을 넣고 저장해 주세요. 그 전까지는 태블릿에만 쌓아 둡니다.';
      return;
    }
    b.className = ''; b.innerHTML = '';
  }

  // ── 블루투스 스캔 ──
  $('btnScan').onclick = async () => {
    if (scan && scan.active) { stopScan(); return; }
    await startScan();
  };
  // 수신을 껐다 다시 켜서 주변 센서를 새로 찾는다(버튼을 눌러야만 가능 — 브라우저 보안 규칙)
  // 다시 찾는 동안(15초) 버튼에 남은 시간과 잡힌 센서 수를 보여 주고, 끝나면 결과를 알려 준다
  const RESCAN_MS = 15000;
  let rescanUntil = 0, rescanTimer = null;
  const rescanFound = new Set();
  $('btnRescan').onclick = async () => {
    if (rescanUntil) return;                  // 찾는 중에는 다시 누르지 않음
    const btn = $('btnRescan');
    btn.disabled = true; btn.textContent = '다시 시작하는 중…';
    if (scan && scan.active) { try { scan.stop(); } catch {} }
    pendingIds.clear(); rescanFound.clear();
    log('센서 다시 찾기');
    await new Promise(r => setTimeout(r, 400));
    if (!(await startScan())) { btn.disabled = false; btn.textContent = '센서 다시 찾기'; return; }
    rescanUntil = Date.now() + RESCAN_MS;
    const tick = () => {
      const left = Math.ceil((rescanUntil - Date.now()) / 1000);
      if (left > 0) { btn.textContent = `찾는 중… ${left}초 · ${rescanFound.size}대`; return; }
      clearInterval(rescanTimer); rescanUntil = 0;
      const filt = (id) => !cfg.only || cfg.only.split(',').some(s => s.trim() && id.toLowerCase().includes(s.trim().toLowerCase()));
      const missed = [...seen].filter(id => filt(id) && !rescanFound.has(id));
      const lab = (id) => meta.labels[id] || id;
      const msg = `다시 찾기 완료 — 센서 ${rescanFound.size}대 수신` + (missed.length ? ` · 안 잡힌 센서 ${missed.length}대: ${missed.map(lab).join(', ')}` : ' · 아는 센서 모두 수신');
      log(msg); toast(msg, missed.length ? 'wn' : 'ok');
      btn.textContent = `완료 · ${rescanFound.size}대 수신`;
      setTimeout(() => { btn.disabled = false; btn.textContent = '센서 다시 찾기'; }, 4000);
    };
    tick(); rescanTimer = setInterval(tick, 1000);
  };
  function toast(text, cls) {
    const t = $('toast');
    t.className = 'toast show ' + (cls || '');
    t.textContent = text;
    clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', 8000);
  }
  async function startScan() {
    try {
      scan = await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true, keepRepeatedDevices: true });
      scanStartTs = Date.now();
      log('블루투스 수신 시작');
      await keepAwake();
      updateScanUi();
      return true;
    } catch (e) {
      log('수신 시작 실패: ' + e.message);
      alert('블루투스 수신을 시작하지 못했습니다.\n\n' + e.message +
        '\n\n확인: 블루투스 켜짐, 위치(GPS) 켜짐, Chrome의 위치·주변기기 권한 허용');
      return false;
    }
  }
  function stopScan() {
    try { scan && scan.stop(); } catch {}
    log('블루투스 수신 중지');
    updateScanUi();
  }

  if (navigator.bluetooth) {
    navigator.bluetooth.addEventListener('advertisementreceived', (ev) => {
      const devId = ev.device.id;
      const name = ev.name || ev.device.name || nameById.get(devId) || '';
      if (name && nameById.get(devId) !== name) { nameById.set(devId, name); knownDirty = true; }
      // 이름(센서ID)을 아직 모르는 신호는 기록하지 않고 '이름 확인 중'으로만 센다
      // (같은 센서가 이름 없는 항목으로 따로 잡히는 것을 막기 위함, 보통 몇 초 안에 이름이 들어옴)
      if (!name) {
        for (const cid of ev.manufacturerData.keys()) if (cid === 0x8801 || cid === 0xEC88) { pendingIds.set(devId, Date.now()); scheduleRender(); }
        return;
      }
      pendingIds.delete(devId);
      for (const [cid, dv] of ev.manufacturerData) {
        if (cid !== 0x8801 && cid !== 0xEC88 && !/govee|gvh|h51|h50/i.test(name)) continue;
        const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
        const id = sensorId(name, devId);
        if (cfg.only && !cfg.only.split(',').some(s => s.trim() && id.toLowerCase().includes(s.trim().toLowerCase()))) continue;
        const d = decodeGovee(cid, bytes);
        const raw = cid.toString(16).padStart(4, '0') + ' | ' + [...bytes].map(x => x.toString(16).padStart(2, '0')).join(' ');
        if (d && !d.invalid && !seen.has(id)) { seen.add(id); LS.set('gv_seen', [...seen]); }
        const prev = latest.get(id) || {};
        latest.set(id, Object.assign(prev, { id, name, rssi: ev.rssi, raw, rawTs: Date.now() },
          d && !d.invalid ? { ts: Date.now(), temp: d.temp, hum: d.hum, batt: d.batt, model: d.model, bad: false } : { bad: true }));
        lastAdvTs = Date.now();
        if (rescanUntil && d && !d.invalid) rescanFound.add(id);
      }
      scheduleRender();
    });
  }
  function sensorId(name, devId) {
    const m = name.match(/(H\d{4}).*?([0-9A-F]{4})$/i);
    if (m) return `${m[1].toUpperCase()}_${m[2].toUpperCase()}`;
    return name || ('dev_' + devId.slice(0, 8));
  }

  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { log('화면 꺼짐 방지 실패: ' + e.message); }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && scan && scan.active) keepAwake(); });

  // ── 일정 간격 기록 ──
  let recTimer = null;
  function restartRecorder() {
    clearInterval(recTimer);
    recTimer = setInterval(record, cfg.interval * 1000);
  }
  function record() {
    const now = Date.now();
    let n = 0;
    for (const r of latest.values()) {
      if (!r.ts || now - r.ts > cfg.interval * 2000) continue;   // 최근 신호가 없으면 기록하지 않음
      queue.push([now, r.id, r.temp, r.hum, r.batt ?? null, r.rssi ?? null]);
      n++;
    }
    if (queue.length > QUEUE_MAX) {
      const drop = queue.length - QUEUE_MAX;
      queue.splice(0, drop);
      log(`전송 대기 초과로 오래된 ${drop}건 삭제`);
    }
    if (n) saveQueue();
    updateStatus();
  }
  function saveQueue() {
    if (LS.set('gv_queue2', encodeQueue(queue))) return;
    // 저장공간이 꽉 차면 가장 오래된 10%를 버리고 다시 시도
    const drop = Math.max(1, Math.floor(queue.length / 10));
    queue.splice(0, drop);
    log(`태블릿 저장공간 부족으로 오래된 ${drop}건 삭제 — 인터넷 연결을 확인하세요`);
    LS.set('gv_queue2', encodeQueue(queue));
  }

  // ── 시트로 전송 ──
  async function upload(manual) {
    if (uploading || !cfg.url || !cfg.token) { if (manual) alert('설정에서 주소와 비밀 문자열을 먼저 저장하세요.'); return; }
    uploading = true;
    const batch = queue.slice(0, BATCH);
    const body = {
      token: cfg.token,
      collector: cfg.collector,
      interval: cfg.interval,
      queue: queue.length,
      scanning: !!(scan && scan.active),
      lastAdvTs,
      batchId: batch.length ? `${cfg.collector}-${batch[0][0]}-${batch[0][1]}-${batch.length}-${batch[batch.length - 1][0]}` : '',
      readings: batch.map(r => ({ ts: r[0], sensor: r[1], temp: r[2], hum: r[3], batt: r[4], rssi: r[5] })),
    };
    try {
      const res = await fetch(cfg.url, { method: 'POST', body: JSON.stringify(body) });  // text/plain → 사전요청 없음
      const j = await res.json();
      if (!j.ok) throw new Error(j.error === 'unauthorized' ? '비밀 문자열 불일치' : (j.error || '알 수 없는 오류'));
      queue.splice(0, batch.length);
      saveQueue();
      lastUpOk = true; lastUpTs = Date.now();
      if (manual || batch.length) log(`전송 완료 ${j.written ?? 0}건${j.duplicate ? ' (중복 건너뜀)' : ''}, 남은 대기 ${queue.length}건`);
      if (manual) alert('전송 성공');
      if (queue.length >= BATCH) setTimeout(() => upload(false), 1500);   // 밀린 데이터 빠르게 비우기
    } catch (e) {
      lastUpOk = false;
      log('전송 실패: ' + e.message);
      if (manual) alert('전송 실패: ' + e.message);
    } finally {
      uploading = false;
      updateStatus();
    }
  }
  setInterval(() => upload(false), 30000);

  // ── 화면 ──
  let renderPending = false;
  function scheduleRender() { if (!renderPending) { renderPending = true; requestAnimationFrame(() => { renderPending = false; render(); }); } }
  function ago(ts) {
    if (!ts) return '-';
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 60) return `${s}초 전`;
    if (s < 3600) return `${Math.floor(s / 60)}분 전`;
    return `${Math.floor(s / 3600)}시간 전`;
  }
  function render() {
    const box = $('sensors');
    const lab = (id) => meta.labels[id] || '', lc = (id) => meta.locations[id] || '';
    // 위치 → 이름 순으로 정렬(위치 없는 센서는 뒤로)
    // 지금 잡힌 센서 + 전에 잡혔는데 지금 안 보이는 센서('찾는 중')
    const filt = (id) => !cfg.only || cfg.only.split(',').some(s => s.trim() && id.toLowerCase().includes(s.trim().toLowerCase()));
    const missing = [...seen].filter(id => !latest.has(id) && filt(id)).map(id => ({ id, missing: true }));
    const list = [...latest.values(), ...missing].sort((a, b) =>
      (lc(a.id) ? 0 : 1) - (lc(b.id) ? 0 : 1) || lc(a.id).localeCompare(lc(b.id), 'ko') || (lab(a.id) || a.id).localeCompare(lab(b.id) || b.id, 'ko'));
    if (!list.length) return;
    box.innerHTML = list.map(r => {
      if (r.missing) return `<div class="sensor missing">
        <button class="edit" data-id="${esc(r.id)}" title="이름·위치 바꾸기">✎</button>
        <div class="name">${esc(lab(r.id) || r.id)}</div>
        <div class="id">${lc(r.id) ? `<span class="loc">${esc(lc(r.id))}</span> · ` : ''}${esc(r.id)}</div>
        <div class="vals"><div><span class="big">찾는 중…</span></div></div>
        <div class="meta">이 태블릿에서 전에 잡혔던 센서입니다. 아직 신호가 없습니다.</div>
      </div>`;
      const stale = !r.ts || Date.now() - r.ts > 120000;
      return `<div class="sensor">
        <button class="edit" data-id="${esc(r.id)}" title="이름·위치 바꾸기">✎</button>
        <div class="name">${esc(lab(r.id) || r.id)} ${stale ? '<span class="wn">· 신호 없음</span>' : ''}</div>
        <div class="id">${lc(r.id) ? `<span class="loc">${esc(lc(r.id))}</span> · ` : ''}${lab(r.id) ? esc(r.id) + ' · ' : ''}${esc(r.name || '')}${r.model ? ' · ' + r.model : ''}</div>
        <div class="vals">
          <div><span class="big">${r.hum != null ? r.hum.toFixed(1) : '–'}</span><span class="unit">%RH</span></div>
          <div><span class="big">${r.temp != null ? r.temp.toFixed(1) : '–'}</span><span class="unit">°C</span></div>
        </div>
        <div class="meta">배터리 ${r.batt ?? '–'}% · 신호 ${r.rssi ?? '–'} dBm · ${ago(r.ts)}</div>
        ${r.bad ? '<div class="meta er">마지막 신호를 해석하지 못했습니다 — 원시 신호를 확인해 주세요</div>' : ''}
        ${showRaw ? `<div class="raw">${esc(r.raw || '')}</div>` : ''}
      </div>`;
    }).join('');
    box.querySelectorAll('.edit').forEach(b => b.onclick = () => openEdit(b.dataset.id));
  }

  // ── 센서 이름·위치: 대시보드와 같은 값을 공유 ──
  let meta = Object.assign({ labels: {}, locations: {} }, LS.get('gv_meta', {}));
  async function fetchMeta() {
    if (!cfg.url || !cfg.token) return;
    try {
      const res = await fetch(`${cfg.url}?token=${encodeURIComponent(cfg.token)}&cfg=1`);
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || '응답 오류');
      meta = { labels: j.labels || {}, locations: j.locations || {} };
      LS.set('gv_meta', meta);
      render();
    } catch (e) { log('센서 이름 불러오기 실패: ' + e.message); }
  }
  setInterval(fetchMeta, 5 * 60000);   // 대시보드에서 바꾼 이름을 5분마다 반영
  let editId = null;
  function openEdit(id) {
    if (!cfg.url || !cfg.token) { alert('설정에서 Apps Script 주소와 비밀 문자열을 먼저 저장해 주세요.'); return; }
    editId = id;
    $('edId').textContent = id;
    $('edLabel').value = meta.labels[id] || '';
    $('edLoc').value = meta.locations[id] || '';
    $('edLocList').innerHTML = [...new Set(Object.values(meta.locations))].sort().map(l => `<option value="${esc(l)}">`).join('');
    $('edMsg').textContent = '';
    $('dlgEdit').showModal();
  }
  $('edCancel').onclick = () => $('dlgEdit').close();
  // 다른 연구실로 옮긴 센서 등, 이 태블릿에서 더 이상 기다리지 않을 센서를 '찾는 중' 목록에서 뺀다
  $('edForget').onclick = () => {
    if (!confirm(`${editId}를 이 태블릿의 목록에서 뺄까요?\n(시트의 기록과 이름은 그대로이며, 다시 잡히면 목록에 돌아옵니다)`)) return;
    seen.delete(editId); latest.delete(editId); LS.set('gv_seen', [...seen]);
    $('dlgEdit').close(); render(); updateStatus();
  };
  $('edSave').onclick = async () => {
    $('edSave').disabled = true; $('edMsg').textContent = '저장 중…';
    try {
      const res = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ token: cfg.token, type: 'setSensor', id: editId, label: $('edLabel').value, loc: $('edLoc').value }) });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error === 'unauthorized' ? '비밀 문자열 불일치' : (j.error || '알 수 없는 오류'));
      meta = { labels: j.labels || {}, locations: j.locations || {} };
      LS.set('gv_meta', meta);
      log(`${editId} 이름·위치 저장됨`);
      $('dlgEdit').close(); render();
    } catch (e) { $('edMsg').textContent = '저장 실패: ' + e.message; }
    finally { $('edSave').disabled = false; }
  };

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function updateScanUi() {
    const on = !!(scan && scan.active);
    $('btnScan').textContent = on ? '수집 중지' : '수집 시작';
    $('btnScan').className = on ? 'stop' : 'primary';
    updateStatus();
  }
  function updateStatus() {
    const on = !!(scan && scan.active);
    const quiet = on && lastAdvTs && Date.now() - lastAdvTs > 120000;
    $('stScan').innerHTML = !on ? '<span class="er">중지됨</span>' : quiet ? '<span class="wn">신호 끊김</span>' : '<span class="ok">수신 중</span>';
    $('stUp').innerHTML = lastUpOk === null ? '-' : lastUpOk ? '<span class="ok">정상</span>' : '<span class="er">실패</span>';
    $('stQueue').textContent = `${queue.length.toLocaleString()}건`;
    $('stLast').textContent = ago(lastUpTs);
    // 센서 수: 최근 2분 안에 값이 들어온 센서 / 이 태블릿이 알고 있는 센서
    const filt = (id) => !cfg.only || cfg.only.split(',').some(s => s.trim() && id.toLowerCase().includes(s.trim().toLowerCase()));
    const known = new Set([...seen, ...latest.keys()].filter(filt));
    const live = [...latest.values()].filter(r => r.ts && Date.now() - r.ts < 120000).length;
    for (const [k, t] of pendingIds) if (Date.now() - t > 60000) pendingIds.delete(k);
    const pend = pendingIds.size;
    $('stSensors').innerHTML = !known.size && !pend ? '-'
      : `<span class="${live < known.size ? 'wn' : 'ok'}">${live} / ${known.size}대</span>${pend ? ` <span class="wn" style="font-size:12px">+ 이름 확인 중 ${pend}</span>` : ''}`;
    // 시작 후 1분이 지났는데도 안 잡히는 센서가 있으면 안내
    const missing = [...known].filter(id => { const r = latest.get(id); return !r || !r.ts || Date.now() - r.ts > 120000; });
    const tip = $('missTip');
    if (on && scanStartTs && Date.now() - scanStartTs > 60000 && missing.length) {
      const lab = (id) => meta.labels[id] || id;
      tip.style.display = '';
      tip.innerHTML = `<b>안 잡히는 센서 ${missing.length}대:</b> ${missing.map(id => esc(lab(id))).join(', ')}
        <ol>
          <li><b>Govee Home 앱을 완전히 종료</b>하세요(설정 → 애플리케이션 → Govee Home → 강제 중지). 앱이 센서에 연결되어 있는 동안에는 센서가 신호를 보내지 않습니다.</li>
          <li><b>센서 다시 찾기</b>를 누르세요.</li>
          <li>그래도 안 되면 센서와 태블릿의 거리·벽(특히 금속 챔버 벽)과 센서 배터리를 확인하세요.</li>
        </ol>`;
    } else tip.style.display = 'none';
    if (knownDirty) { knownDirty = false; LS.set('gv_known', Object.fromEntries(nameById)); }
  }
  setInterval(() => { updateStatus(); render(); }, 5000);

  // ── 화면 보호 ──
  // 같은 화면이 오래 떠 있지 않도록, 손대지 않은 지 cfg.saverMin분이 지나면 검은 화면으로 바꾸고
  // 작은 시계·상태 글자를 20초마다 다른 위치로 옮긴다. 화면은 켜진 채라 블루투스 수신은 계속된다.
  let lastTouch = Date.now();
  const saver = $('saver'), box = $('saverBox');
  let ignoreClicksUntil = 0;
  const wake = () => {
    lastTouch = Date.now();
    if (saver.classList.contains('on')) {
      saver.classList.remove('on');
      ignoreClicksUntil = Date.now() + 600;   // 화면을 깨운 터치가 아래 버튼(수집 중지 등)을 누르지 않도록
      render(); updateStatus();
    }
  };
  document.addEventListener('click', (e) => { if (Date.now() < ignoreClicksUntil) { e.stopPropagation(); e.preventDefault(); } }, true);
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
  function saverTick() {
    const idle = Date.now() - lastTouch;
    if (!cfg.saverMin || idle < cfg.saverMin * 60000) return;
    if (!saver.classList.contains('on')) saver.classList.add('on');
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    $('svTime').textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
    const on = !!(scan && scan.active);
    const quiet = on && lastAdvTs && Date.now() - lastAdvTs > 120000;
    const fresh = [...latest.values()].filter(r => r.ts && Date.now() - r.ts < 120000).length;
    let cls = '', txt;
    if (!on) { cls = 'er'; txt = '수집 중지됨 — 화면을 눌러 수집 시작'; }
    else if (quiet) { cls = 'wn'; txt = '센서 신호 끊김'; }
    else if (lastUpOk === false) { cls = 'wn'; txt = `시트 전송 실패 · 대기 ${queue.length.toLocaleString()}건`; }
    else txt = `수신 중 · 센서 ${fresh}대${queue.length ? ` · 대기 ${queue.length.toLocaleString()}건` : ''}`;
    $('svStat').className = 'sv-stat ' + cls;
    $('svStat').textContent = txt;
    // 위치 옮기기
    const w = box.offsetWidth || 260, h = box.offsetHeight || 100;
    box.style.left = Math.round(Math.random() * Math.max(0, innerWidth - w)) + 'px';
    box.style.top = Math.round(Math.random() * Math.max(0, innerHeight - h)) + 'px';
  }
  setInterval(saverTick, 20000);

  renderBanner();
  restartRecorder();
  updateScanUi();
  fetchMeta();
  if (queue.length) log(`이전에 전송하지 못한 ${queue.length}건이 남아 있어 이어서 보냅니다`);
})();
</script>
</body>
</html>
